:root{
  --bg:#0b0f14; --surface:#111821; --surface2:#16202b; --ink:#d9e2ec; --strong:#ffffff; --muted:#7d8b99; --line:#1f2a36;

  --band1:#163454; --band2:#15392f; --band3:#43381a; --band4:#4a2124;
  --price:#ffffff;
  --c1:#4a9eea; --c2:#f2994a; --c3:#c084fc; --c4:#3ad29f; --c5:#f472b6; --c6:#facc15; --c7:#22d3ee; --c8:#a3e635; --c9:#fb7185; --c10:#94a3b8;
  --here:#a78bfa; --here-glow:rgb(167 139 250 / .4);
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-mode="light"]{
  /* 白天模式＝版型一「河流」配色：淺灰綠底、玉綠主色、文楷字的股名 */
  --bg:#f3f5f2; --surface:#ffffff; --surface2:#eef3f0; --ink:#18231f; --strong:#18231f; --muted:#5c6b65; --line:#d9e0dc;
  --accent:#1f6f5c; --accent-soft:#e1efe9;
  --up:#c0392b; --dn:#1f8a5c;
  --cheap:#2b6cb0; --fair:#b7791f; --rich:#c0392b;
  --band1:#cfe0f3; --band2:#dcebe3; --band3:#f3e6c9; --band4:#f5d3cd;
  --price:#18231f;
  --c1:#1f6fb0; --c2:#c2410c; --c3:#7c3aed; --c4:#15803d; --c5:#be185d; --c6:#a16207; --c7:#0e7490; --c8:#4d7c0f; --c9:#e11d48; --c10:#475569;

}

function loopStrip(sc, n, cur, pick, again) {

}

// 河流圖要畫到「現在」：最後一個月的資料若早於現價日期，補一欄本月（股價＝現價，河流帶＝最新每股盈餘或淨值），
// 這樣現價點和右邊的河流帶用的是同一期財報，和上方的評價一致
function chartData(s, key) {
  const m = s[key], v = s.verdict, months = s.monthly.slice(), base = m.series.slice();
  const ym = v && String(v.priceDate || '').slice(0, 7), cb = m.current[BK[key]];
  if (v && months.length && ym > months[months.length - 1].ym) { months.push({ym, avg: v.price, high: v.price, low: v.price, now: true}); base.push({ym, base: cb}); }
  return {months, base};
}
function riverSVG(s, key) {
  const m = s[key];
  if (!m || !s.monthly.length) return `<p class="nodata">${MNAME[key]}資料不足，無法畫河流圖（無資料）。</p>`;
  const q = m.quantiles, lv = ['min', 'p25', 'p50', 'p75', 'max'];
  const {months, base} = chartData(s, key);
  const W = 900, H = 380, L = 56, R = 70, T = 14, B = 34;
  let ymax = 0, ymin = Infinity;
  months.forEach((mo, i) => { ymax = Math.max(ymax, mo.high || mo.avg, base[i].base * q.max); ymin = Math.min(ymin, mo.low || mo.avg, base[i].base * q.min); });
  ymin = Math.max(0, ymin * 0.9); ymax = ymax * 1.05;
  const x = i => L + (W - L - R) * (months.length === 1 ? 0 : i / (months.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - ymin) / (ymax - ymin));
  const line = k => base.map((b, i) => `${x(i).toFixed(1)},${y(b.base * q[k]).toFixed(1)}`);
  const bandFill = ['var(--band1)', 'var(--band2)', 'var(--band3)', 'var(--band4)'];
  let g = '';
  for (let j = 0; j < 4; j++) {
    const a = line(lv[j]), b = line(lv[j + 1]).reverse();
    g += `<polygon points="${a.join(' ')} ${b.join(' ')}" fill="${bandFill[j]}" stroke="none"/>`;
  }
  // 格線與 Y 軸
  const step = niceStep((ymax - ymin) / 5);
  for (let v = Math.ceil(ymin / step) * step; v <= ymax; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" opacity=".7"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`;
  }
  months.forEach((mo, i) => { if (mo.ym.endsWith('-01')) g += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle">${mo.ym.slice(0, 4)}</text><line x1="${x(i)}" x2="${x(i)}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--muted)"/>`; });
  lv.forEach(k => { const last = base[base.length - 1].base * q[k]; g += `<text x="${W - R + 6}" y="${y(last) + 4}">${q[k].toFixed(1)}倍</text>`; });
  // 股價線（月均價）與最新股價
  const pl = months.map((mo, i) => `${x(i).toFixed(1)},${y(mo.avg).toFixed(1)}`).join(' ');
  g += `<polyline points="${pl}" fill="none" stroke="var(--price)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const v = s.verdict;
  if (v) g += `<circle cx="${x(months.length - 1)}" cy="${y(v.price)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  g += `<line id="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.name}${MNAME[key]}河流圖">${g}</svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }

function bindTip(s, key) {
  const box = $('.chartbox'), svg = box.querySelector('svg'), hit = svg && svg.querySelector('#hit'), tip = $('#tip'), hair = svg && svg.querySelector('#hair');
  if (!hit) return;

      <span style="color:var(--rich)">75% 線 <span class="num">${fmt(b * q.p75, 1)}</span></span><br>中位數線 <span class="num">${fmt(b * q.p50, 1)}</span><br>

      <div><span class="muted">預估年股利</span><b>${money(tdv)}</b><small class="muted">${tdv != null && tv ? `組合殖利率 ${fmt(tdv / tv * 100, 2)}%` : ''}</small></div>
    </div>
    <div class="myzone" title="依目前市值">${zones.filter(z => z[1] > 0).map(([z, w]) => `<span class="${z}" style="flex:${w}">${z} ${fmt(w, 0)}%</span>`).join('')}</div>
    <div class="tbl-wrap"><table class="q mytbl"><thead><tr><th>股票</th><th>數量</th><th>成本</th><th>現價</th><th>市值</th><th>損益</th><th>評價</th><th>殖利率</th><th>下次除權息</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><a href="#s${r.h.code}"><span class="muted">${r.h.code}</span><span class="nm">${r.s ? r.s.name : '（已不在清單）'}</span></a></td>
      <td>${r.h.shares % 1000 ? r.h.shares.toLocaleString('zh-TW') + ' 股' : (r.h.shares / 1000).toLocaleString('zh-TW') + ' 張'}</td><td>${r.h.cost ? fmt(r.h.cost, 2) : '<span class="muted">未填</span>'}</td>
      <td class="${cls(r.c)}">${r.p ? fmt(r.p, dp(r.p)) : '無資料'}</td><td>${money(r.val)}</td>
      <td class="${cls(r.pl)}">${r.pl == null ? '<span class="muted">—</span>' : pm(r.pl) + `<br><small>${pct(r.pl, r.cost)}</small>`}</td>
      <td>${r.v ? `<span class="pill ${r.v.zone}">${r.v.zone}</span>` : '無資料'}</td>
      <td>${r.s && r.s.yield != null ? fmt(r.s.yield, 2) + '%' : '無資料'}</td>
      <td>${r.nx ? `${+r.nx.date.slice(5, 7)}/${+r.nx.date.slice(8)}${r.nx.cash ? `<br><small>${fmt(r.nx.cash * r.h.shares, 0)} 元</small>` : ''}` : '<span class="muted">—</span>'}</td>
      <td class="myact"><button type="button" class="lnk" data-ed="${r.i}">修改</button><button type="button" class="lnk" data-del="${r.i}">刪除</button></td></tr>`).join('')}

    <p class="muted small">現價、評價、殖利率和網站其他地方相同（證交所盤後資料，盤中約每分鐘更新）。預估年股利＝市值 × 殖利率，是用過去配息估的，不保證之後會配一樣多。下次除權息的金額＝每股現金股利 × 你的股數，未扣稅和匯費。</p>` : '<div class="gempty">還沒有持股。在上面選股票、填股數就能加入。</div>'}`;
  $('#my-f').onsubmit = ev => {

// 個股比較：和河流圖一樣用上面的群組列選群組，群組內全部股票一起比。上面是漲跌幅疊圖（起點都設成 100，點圖例可隱藏），
// 下面是一檔一列的比較表，點欄位標題排序，每一欄最好的一檔加粗並標「最佳」
function cmpPage() {
  const g = G.list[G.cur], list = g ? DATA.stocks.filter(s => g.codes.includes(s.code)) : [], p = CMP.period;
  const col = {}; list.forEach((s, i) => { col[s.code] = CMP_COL[i % CMP_COL.length]; });
  const NA = s => s.kind === 'etf' ? '不適用' : null;
  // 欄位：名稱、取值、方向（1 越大越好、-1 越小越好、0 不比）、顯示、同業中位數的欄位、說明
  const pct1 = v => (v > 0 ? '+' : '') + fmt(v, 1) + '%';
  const cols = [
    {k: 'mult', n: '目前倍數', f: s => s.verdict && s.verdict.multiple, d: 0, show: (v, s) => `${fmt(v, 1)} <span class="muted">${MLAB[s.method] || ''}</span>`, tip: '河流圖用的評價倍數：本益比（PE）、淨值比（PB）或 ETF 的本利比'},
    {k: 'rank', n: '五年位置', f: s => s.verdict && s.verdict.rank, d: -1, show: v => v + '%', tip: '目前倍數高過過去五年多少比例的樣本，越低越便宜'},
    {k: 'fair', n: '離合理價', f: s => s.verdict && s.verdict.fair ? (s.verdict.fair / s.verdict.price - 1) * 100 : null, d: 1, show: pct1, tip: '合理價＝五年中位數倍數對應的價格；正數＝現價低於合理價，負數＝已超過'},
    {k: 'zone', n: '評價', f: s => s.verdict && s.verdict.zone, d: 0, show: v => `<span class="zt ${v}">${v}</span>`, sort: s => ({低估: 0, 合理: 1, 高估: 2})[s.verdict && s.verdict.zone] ?? 9},
    {k: 'yield', n: '殖利率', f: s => s.yield, d: 1, show: v => fmt(v) + '%', pk: 'yield', tip: '個股為證交所公布；ETF 為近 12 個月配息 ÷ 價格；大盤為市值加權'},
    {k: 'eps', n: '獲利年增', f: cmpEpsYoY, d: 1, show: pct1, na: NA, tip: '近四季每股盈餘和一年前比（大盤用隱含每股盈餘）'},
    {k: 'roe', n: 'ROE', f: cmpRoe, d: 1, show: v => fmt(v, 1) + '%', na: NA, tip: '股東權益報酬率＝淨值比 ÷ 本益比'},
    {k: 'pe', n: '本益比', f: s => s.kind === 'etf' ? null : s.kind === 'index' ? s.mkt && s.mkt.pe : ((lastSnap(s) || {}).pe || fd(s).pe || null), d: 0, show: v => fmt(v, 1), pk: 'pe', na: NA, tip: '不同產業不能直接比，看它和同業中位數的差距'},
    {k: 'rev', n: '月營收年增', f: s => fd(s).revYoY, d: 1, show: pct1, pk: 'revYoY', na: s => s.kind ? '不適用' : null, tip: () => `${FUND && FUND.revYm ? FUND.revYm + ' ' : ''}單月營收和去年同月比`},
    {k: 'revc', n: '累計營收年增', f: s => fd(s).revCumYoY, d: 1, show: pct1, pk: 'revCumYoY', na: s => s.kind ? '不適用' : null, tip: '今年到最近一個月的累計營收和去年同期比'},
    {k: 'gm', n: '毛利率', f: s => fd(s).gm, d: 1, show: v => fmt(v, 1) + '%', pk: 'gm', na: s => s.kind || fd(s).industry === '金融保險業' ? '不適用' : null, tip: () => `${FUND && FUND.period ? FUND.period + '；' : ''}金融業沒有毛利率`},
    {k: 'om', n: '營業利益率', f: s => fd(s).om, d: 1, show: v => fmt(v, 1) + '%', pk: 'om', na: s => s.kind || fd(s).industry === '金融保險業' ? '不適用' : null, tip: '本業賺錢的能力（營業利益 ÷ 營收）'},
    {k: 'debt', n: '負債比', f: s => fd(s).debt, d: -1, show: v => fmt(v, 1) + '%', pk: 'debt', na: s => s.kind ? '不適用' : null, tip: () => `${FUND && FUND.bsPeriod ? FUND.bsPeriod + '；' : ''}負債 ÷ 資產，越低越穩；金融業吸收存款、保費，本來就很高`},
    {k: 'ret', n: `${CMP_P[p]}漲跌`, f: s => cmpReturn(s, p), d: 1, show: pct1, tip: p === '1m' ? '每日收盤' : '月均價，最後一點是現價'},
    {k: 'dd', n: '五年最大跌幅', f: cmpMaxDD, d: 1, show: v => fmt(v, 1) + '%', tip: '從之前的最高價到之後的最低價，最多跌過幾 %（月資料）'},
    {k: 'ind', n: '產業', f: s => s.kind === 'etf' ? 'ETF' : s.kind === 'index' ? '大盤' : (fd(s).industry || null), d: 0, show: v => v, tip: '證交所產業別；「同業」是同一產業全部上市公司的中位數'},
  ];
  const val = list.map(s => Object.fromEntries(cols.map(c => { const v = c.f(s); return [c.k, v === undefined ? null : v]; })));
  const best = Object.fromEntries(cols.filter(c => c.d).map(c => { const nums = val.map(r => r[c.k]).filter(v => typeof v === 'number' && isFinite(v)); return [c.k, nums.length > 1 ? (c.d > 0 ? Math.max(...nums) : Math.min(...nums)) : null]; }));
  let order = list.map((s, i) => i);
  const sc = cols.find(c => c.k === CMP.sort);
  if (sc) { const key = i => sc.sort ? sc.sort(list[i]) : val[i][sc.k]; order.sort((a, b) => { const x = key(a), y = key(b); if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * CMP.dir; }); }
  const cell = (c, s, v) => {
    const pm = c.pk && !s.kind ? (im(s) || {})[c.pk] : null, peer = pm != null ? `<span class="cpeer">同業 ${c.show(pm, s)}</span>` : '';
    if (v == null || (typeof v === 'number' && !isFinite(v))) return `<td class="muted">${(c.na && c.na(s)) || '無資料'}${peer}</td>`;
    const b = typeof v === 'number' && v === best[c.k];
    return `<td${b ? ' class="cbest"' : ''}><span class="cv">${c.show(v, s)}</span>${b ? '<span class="ctag">最佳</span>' : ''}${peer}</td>`;
  };
  const rows = order.map(i => { const s = list[i]; return `<tr${CMP.hide.has(s.code) ? ' class="chid"' : ''}><th scope="row"><a href="#s${s.code}"><b class="cdot" style="background:${col[s.code]}"></b><span class="muted num">${s.kind === 'index' ? '大盤' : s.code}</span> <span class="cnm">${esc(s.name)}</span></a></th>${cols.map(c => cell(c, s, val[i][c.k])).join('')}</tr>`; }).join('');
  const head = cols.map(c => `<th><button type="button" data-sort="${c.k}" aria-label="依${c.n}排序">${c.n}${CMP.sort === c.k ? (CMP.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('');
  const vis = list.filter(s => !CMP.hide.has(s.code));
  $('#app').innerHTML = `
    ${topNav('cmp')}
    ${groupBar()}
    ${list.length < 2 ? `<div class="gempty">${list.length ? '這個群組只有 1 檔，' : '這個群組還沒有股票，'}至少要 2 檔才能比較。再點一次上面的群組名稱，就能搜尋並勾選股票。</div>` : `
    <div class="chartbox">
      <div class="charttools"><h3>${esc(g.name)}　漲跌幅比較（起點＝100）</h3>
        <div class="seg" role="group" aria-label="期間">${Object.entries(CMP_P).map(([k, t]) => `<button data-p="${k}" aria-pressed="${k === p}">${t}</button>`).join('')}</div></div>
      <div class="cmpchart">${vis.length ? cmpChart(vis, p, col) : '<p class="nodata">全部都隱藏了，點下面的股票名稱顯示。</p>'}</div>
      <div class="clegend">${list.map(s => `<button type="button" data-tg="${s.code}" aria-pressed="${!CMP.hide.has(s.code)}"><b style="background:${col[s.code]}"></b>${s.kind === 'index' ? '加權指數' : s.code + ' ' + esc(s.name)}</button>`).join('')}
        ${list.some(s => s.code === 'TAIEX') ? '' : `<button type="button" id="cix" aria-pressed="${CMP.ix}"><b class="cdash"></b>加權指數（虛線）</button>`}</div>
      <p class="src">點股票名稱可以在圖上隱藏或顯示。</p>
    </div>
    <div class="tbl-wrap cwrap"><table class="q cmpt"><thead><tr><th class="cfirst">股票</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <details class="cnotes"><summary>各欄說明</summary><dl>${cols.filter(c => c.tip).map(c => `<dt>${c.n}</dt><dd>${typeof c.tip === 'function' ? c.tip() : c.tip}</dd>`).join('')}</dl></details>
    <p class="src">點欄位名稱排序，再點一次反過來。每一欄最好的一檔加粗並標「最佳」（手機上是加底線）；目前倍數、本益比、評價、產業不分好壞。每一檔的倍數都是跟它自己過去五年比，不同產業的本益比不能直接比高低，所以用「五年位置」和「離合理價」比較誰相對便宜。${SRC('各股')}${FUND ? ` 營收、毛利率、負債比與同業中位數：${esc(FUND.source)}，${esc(FUND.updated)} 更新。` : ' 營收、毛利率、負債比：無資料。'}</p>`}`;
  bindGroups();
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { CMP.period = b.dataset.p; cmpPage(); });
  document.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => { const c = b.dataset.tg; CMP.hide.has(c) ? CMP.hide.delete(c) : CMP.hide.add(c); cmpPage(); });
  const cx = $('#cix'); if (cx) cx.onclick = () => { CMP.ix = !CMP.ix; cmpPage(); };
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { const k = b.dataset.sort; if (CMP.sort === k) CMP.dir = -CMP.dir; else { CMP.sort = k; const c = cols.find(x => x.k === k); CMP.dir = c.d < 0 ? 1 : c.d > 0 ? -1 : 1; } const y = window.scrollY, sl = $('.cwrap').scrollLeft; cmpPage(); window.scrollTo(0, y); $('.cwrap').scrollLeft = sl; });
}
// 首頁和比較頁共用群組列：切換、編輯群組之後重畫目前這一頁
function mainView() { if (/^#cmp/.test(location.hash)) cmpPage(); else if (/^#my/.test(location.hash)) myPage(); else home(); }

function route(keepScroll) {
  if (!DATA) { $('#app').innerHTML = '<p class="nodata">無資料</p>'; return; }
  const h = location.hash.slice(1), m = h.match(/^s([0-9A-Z]{4,6})(?:-(today|k|bt))?$/);
  const y = window.scrollY;
  if (m) detail(m[1], m[2] || 'river'); else if (/^cmp\b/.test(h)) cmpPage(); else if (/^my\b/.test(h)) myPage(); else home();
  window.scrollTo(0, keepScroll ? y : 0);
  const toEnd = () => document.querySelectorAll('.chart').forEach(c => { c.scrollLeft = c.scrollWidth; }); // 圖表預設停在最新的時間
  toEnd(); requestAnimationFrame(toEnd);
  notifyScan();
}
window.addEventListener('hashchange', () => route(false));
route(false);

// 盤後更新：排程每天收盤後把收盤價寫進資料庫，網頁收到就重算燈號
function applyLive(doc) {
  if (!doc || !doc.items) return;
  let n = 0;
  DATA.stocks.forEach(s => {
    const q = doc.items[s.code], v = s.verdict;
    if (!q || !(q.price > 0) || !v || !((q.date + (q.time ? ' ' + q.time : '')) >= v.priceDate)) return;
    const m = s[s.method];
    if (m) { // 加權指數：點數 ÷ 隱含每股盈餘
      const mult = q.price / v.base, hist = s.mults || s.snapshots.map(x => x[s.method]).filter(Boolean);
      Object.assign(v, {multiple: Math.round(mult * 100) / 100, zone: mult < m.quantiles.p25 ? '低估' : (mult > m.quantiles.p75 ? '高估' : '合理'),
        rank: Math.round(hist.filter(x => x < mult).length / Math.max(1, hist.length) * 100)});
    }
    Object.assign(v, {price: q.price, priceDate: q.date + (q.time ? ' ' + q.time : '')});
    if (q.change != null) { s.liveChange = q.change; s.liveDate = q.date; }
    if (Array.isArray(q.recent) && q.recent.length) { const m = new Map(); (s.recent || []).concat(q.recent).forEach(x => { if (x && x.date && x.close > 0) m.set(x.date, x); }); s.recent = [...m.values()].sort((x, y) => x.date < y.date ? -1 : 1).slice(-20); }
    s.latest = {date: q.date + (q.time ? ' ' + q.time : ''), open: q.open, high: q.high, low: q.low, close: q.price, volume_shares: q.volumeLots != null ? q.volumeLots * 1000 : null};
    n++;
  });
  if (n) {
    $('#stamp').textContent = `股價更新：${doc.updatedAt}（台北時間）`; $('#stamp').title = `來源：${doc.source || '無資料'}・評價資料：證交所`; // 太長會在手機上壓到標誌，完整來源放在提示
    route(true);
  }
}
// 財務資料（月營收、毛利率、負債比、產業中位數）：排程每週更新 fund.json，比較頁用
var FUND = null; // var：第一次畫面在這行之前就會用到
(async () => {
  try { const r = await fetch('fund.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return; FUND = await r.json(); if (/^#cmp/.test(location.hash)) route(true); } catch (e) {}
})();
// 獨立網站：排程每天把盤後資料推到 live.json（同一個網址底下）
(async () => {
  if (window.claude) return;
  try {
    const r = await fetch('live.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
    const j = await r.json();
    Object.entries(j.valuation || {}).forEach(([code, doc]) => { const s = DATA.stocks.find(x => x.code === code); if (s) applyVal(s, doc); });
    if (j.market) LIVE.market = j.market;
    if (j.briefs) Object.assign(LIVE.briefs, j.briefs);
    if (j.exdiv) LIVE.exdiv = j.exdiv;
    if (j.quotes) { LIVE.quotes = j.quotes; applyLive(j.quotes); }
    route(true);
  } catch (e) { /* 讀不到就維持網頁內建的收盤價 */ }
})();
(async () => {
  try {
    const db = await window.claude?.use?.('db');
    if (!db) return;
    db.doc('quotes/latest').onSnapshot(snap => { if (snap.exists) { LIVE.quotes = snap.data(); applyLive(LIVE.quotes); } }, () => {});
    db.collection('valuation').onSnapshot(qs => { qs.docs.forEach(d => { const s = DATA.stocks.find(x => x.code === d.id); if (s) applyVal(s, d.data()); }); if (LIVE.quotes) applyLive(LIVE.quotes); route(true); }, () => {});
    db.collection('briefs').onSnapshot(qs => { qs.docs.forEach(d => { LIVE.briefs[d.id] = d.data(); }); route(true); }, () => {});
    db.doc('market/today').onSnapshot(snap => { LIVE.market = snap.exists ? snap.data() : null; route(true); }, () => {});
    const user = await window.claude?.use?.('user');
    const uid = user ? await user.id() : null;
    if (uid) {
      G.ref = db.collection('data/users/' + uid).doc('groups');
      const snap = await G.ref.get();
      if (snap.exists && Array.isArray(snap.data().list) && snap.data().list.length) { G.list = cleanGroups(snap.data().list); if (!location.hash.startsWith('#s')) mainView(); }
      else saveGroups();
    }
  } catch (e) { /* 沒有即時資料時，維持網頁內建的收盤價 */ }
})();
</script>
