<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-title" content="Value">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Value 價值台股</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 版面：上方站名列，首頁為股票清單；點進個股後分「河流圖與資訊」「本日建議」兩個分頁 */
/* 看盤終端：預設深夜模式，右上角可切白天模式（data-mode="light"），紅漲綠跌，藍＝便宜、琥珀＝合理、紅＝昂貴 */
:root{
  --bg:#0b0f14; --surface:#111821; --surface2:#16202b; --ink:#d9e2ec; --strong:#ffffff; --muted:#7d8b99; --line:#1f2a36;
  --accent:#4a9eea; --accent-soft:#16283a;
  --up:#ff5c5c; --dn:#3ad29f;
  --cheap:#56b6ff; --fair:#f2b84b; --rich:#ff6b6b;
  --band1:#163454; --band2:#15392f; --band3:#43381a; --band4:#4a2124;
  --price:#ffffff;
  --here:#a78bfa; --here-glow:rgb(167 139 250 / .4);
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-mode="light"]{
  /* 白天模式＝版型一「河流」配色：淺灰綠底、玉綠主色、文楷字的股名 */
  --bg:#f3f5f2; --surface:#ffffff; --surface2:#eef3f0; --ink:#18231f; --strong:#18231f; --muted:#5c6b65; --line:#d9e0dc;
  --accent:#1f6f5c; --accent-soft:#e1efe9;
  --up:#c0392b; --dn:#1f8a5c;
  --cheap:#2b6cb0; --fair:#b7791f; --rich:#c0392b;
  --band1:#cfe0f3; --band2:#dcebe3; --band3:#f3e6c9; --band4:#f5d3cd;
  --price:#18231f;
  --here:#7c3aed; --here-glow:rgb(124 58 237 / .25);
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  color-scheme:light;
}
:root[data-mode="light"] table.q .nm,:root[data-mode="light"] .panel2 a{font-family:var(--f-display);font-size:16px}
:root[data-mode="light"] .bar b{background:linear-gradient(90deg,#7fa9db,#8cc7a8 40%,#e3bf78 60%,#e39486)}
:root[data-mode="light"] .bar{background:var(--surface2)}
.modebtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.modebtn:hover{border-color:var(--accent)}
.brandrow{display:flex;align-items:center;gap:10px}
.reloadbtn{appearance:none;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer;padding:0}
.reloadbtn:hover{border-color:var(--accent)}
.reloadbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reloadbtn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.topright{display:flex;align-items:center;gap:10px;margin-left:auto}
#modebtn{font-size:17px;line-height:1}
header.top .stamp{flex-basis:100%;text-align:right}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.04em;color:var(--ink);text-decoration:none}
.brand small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:10px}
.stamp{font-size:12.5px;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:22px}
h3{font-size:17px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;padding-block:22px 6px}
.intro p{margin:0;max-width:62ch}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.pill.低估{color:var(--cheap)} .pill.合理{color:var(--fair)} .pill.高估{color:var(--rich)} .pill.無資料{color:var(--muted)}
.list{display:grid;gap:10px;margin-top:18px}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-decoration:none;color:inherit;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .nm{font-family:var(--f-display);font-size:19px;font-weight:700}
.row .cd{font-family:var(--f-num);color:var(--muted);font-size:13px;margin-right:6px}
.row .lbl{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.meter{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--band1),var(--band2) 40%,var(--band3) 60%,var(--band4))}
.meter i{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.go{color:var(--accent);font-weight:700;white-space:nowrap}
.method{margin-top:28px;font-size:13.5px;color:var(--muted);max-width:72ch}
.method h3{color:var(--ink);margin-bottom:6px}
.back{display:inline-block;margin-top:18px;font-size:14px;text-decoration:none}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:14px;margin-top:8px}
.dhead .wheel{margin:0;width:100%}
@media (min-width:700px){.dhead{grid-template-columns:auto 320px;justify-content:start;gap:48px}}
.dhead .dsec{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead .dmeta{font-size:12.5px;margin-top:2px}
.dhead h2{font-size:28px;margin:2px 0}
.dhead .px{font-size:30px;font-family:var(--f-num)}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding-top:18px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 12px 6px;position:relative}
.charttools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:none;padding:5px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:640px;height:auto}
.kchart{display:flex;flex-direction:row-reverse}
.kchart svg{flex:none}
.kinfo{font-size:12.5px;color:var(--muted);min-height:20px;padding:2px 2px 6px}
.kinfo b{color:var(--ink)}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;box-shadow:0 4px 14px rgb(0 0 0 / .12);min-width:150px}
.keys{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);padding:6px 4px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys b{display:inline-block;width:14px;height:10px;border-radius:2px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:16px}
.fact{background:var(--surface);padding:12px 14px}
.fact .lbl{font-size:12px;color:var(--muted)}
.fact .v{font-family:var(--f-num);font-size:19px}
.src{font-size:12px;color:var(--muted);margin-top:10px}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.zone{border-radius:6px;padding:14px;border:1.5px solid var(--line);background:var(--surface)}
.zone .t{font-weight:700;font-size:14px}
.zone .r{font-family:var(--f-num);font-size:20px;margin-top:4px}
.zone.buy{border-color:var(--cheap)} .zone.buy .t{color:var(--cheap)}
.zone.mid{border-color:var(--fair)} .zone.mid .t{color:var(--fair)}
.zone.sell{border-color:var(--rich)} .zone.sell .t{color:var(--rich)}
.zone.here{border:3px solid var(--here);box-shadow:0 0 18px var(--here-glow);padding:12.5px}
.herelbl{color:var(--here)}
.zone.here .t::after{content:"";}
.herebox{display:inline-block;border:2px solid var(--here);border-radius:4px;padding:1px 6px;margin:-3px -8px;box-shadow:0 0 10px var(--here-glow)}
.today{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:18px}
.today ul{margin:6px 0 0;padding-left:20px}
.today li{margin-bottom:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.spark svg{display:block;width:100%;height:auto}
.closed{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-weight:700;margin-bottom:14px}
.lead{margin:8px 0 10px;font-size:15.5px}
.frow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.fk{font-size:12.5px;font-weight:700;color:var(--muted)}
.debate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-block:8px;border-top:1px solid var(--line)}
.debate p{margin:2px 0 0}
.srcs{margin-top:8px;font-size:13px}
.srcs summary{cursor:pointer;color:var(--accent)}
.disclaimer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-weight:700}
.nodata{color:var(--muted);font-style:normal}
.gbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-block:12px 4px}
.gtab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.gtab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--strong);font-weight:700}
.gtab:hover{border-color:var(--accent)}
.gadd{border-style:dashed;color:var(--muted)}
.gedit{margin-left:auto;color:var(--muted)}
.geditor{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:6px}
.geditor input#g-q{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:360px}
.gpick label[hidden]{display:none}
.geditor input#g-name{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:260px}
.gpick{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.gpick label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.askbox{margin-top:16px;display:grid;gap:6px}
.promptpre{white-space:pre-wrap;font-family:var(--f-body);font-size:12.5px;line-height:1.6;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-height:280px;overflow:auto;margin:6px 0 0}
.askbox textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical;width:100%}
/* 問 AI：兩排三格，第一格是標題 —— 問 AI｜Claude｜ChatGPT ／ Gemini｜Grok｜DeepSeek */
.askrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;width:100%;margin-inline:auto;align-items:stretch}
.askrow h3{margin:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.askbtns{display:contents}
.askbtns .gtab{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;padding-inline:6px;min-width:0}
.aico{width:16px;height:16px;border-radius:4px;flex:none}
a.gtab{text-decoration:none;display:inline-block}
.askout{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:14.5px;line-height:1.7}
.logo{display:block;width:168px;height:auto;color:var(--strong)}
header.top{align-items:center}
.ticker{display:flex;gap:22px;overflow-x:auto;white-space:nowrap;padding-block:9px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.ticker b{font-weight:600}
.up,table.q td.up{color:var(--up)} .dn,table.q td.dn{color:var(--dn)} .flat{color:var(--ink)}
.tbl-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.q{width:100%;min-width:860px;border-collapse:collapse;font-family:var(--f-num);font-size:13.5px;font-variant-numeric:tabular-nums}
table.q th{color:var(--muted);font-weight:500;font-size:11.5px;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.q td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
table.q tr:last-child td{border-bottom:0}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q tbody tr{cursor:pointer}
table.q tbody tr:hover td{background:var(--surface2)}
table.q tbody tr.sel td{background:var(--accent-soft)}
table.q tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.preview{margin:12px 0 14px}
.pvname{color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.pvname:hover{color:var(--accent)}
.pvchart{cursor:pointer}
.backrow{display:flex;align-items:center;gap:12px;margin:18px 0 8px;min-width:0}
.backrow .back{flex:none;margin:0}
.schips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.schips::-webkit-scrollbar{display:none}
.schip{appearance:none;font:inherit;flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap;background:var(--surface);cursor:pointer}
.schip.on{color:var(--ink);border-color:var(--accent);background:var(--accent-soft);font-weight:700}
/* 上下滾動的股票選單：中間那一格就是目前的股票 */
.wheel{height:120px;overflow-y:auto;scroll-snap-type:y mandatory;padding-block:40px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--surface);scrollbar-width:none;position:relative;margin-bottom:6px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wrow{height:40px;scroll-snap-align:center;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:0 12px;font-size:14.5px;color:var(--muted);cursor:pointer}
.wrow .wn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow.on{color:var(--ink);font-weight:700;background:var(--accent-soft)}
.wrow .zt{text-align:right;font-weight:700}
.wrow .zt.低估{color:var(--cheap)} .wrow .zt.合理{color:var(--fair)} .wrow .zt.高估{color:var(--rich)}
table.q .nm{font-family:var(--f-body);font-weight:700;color:var(--strong);margin-left:6px}
table.q a{color:inherit;text-decoration:none}
table.q td.zt.低估{color:var(--cheap)} table.q td.zt.合理{color:var(--fair)} table.q td.zt.高估{color:var(--rich)} table.q td.zt{font-family:var(--f-body);font-weight:700}
.bar{display:inline-block;width:90px;height:6px;background:var(--line);position:relative;vertical-align:middle;border-radius:3px;overflow:hidden}
.bar b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cheap),var(--fair),var(--rich))}
.homegrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel2{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.panel2 h4{margin:0 0 8px;font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.1em}
.panel2 p{margin:0 0 8px;font-size:14px}
.panel2 a{color:var(--strong);text-decoration:none;font-weight:700}

@media (max-width:760px){
  .intro,.today,.homegrid{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .row .c-mul,.row .c-meter{display:none}
  .zones,.debate{grid-template-columns:minmax(0,1fr)}
  .frow{grid-template-columns:minmax(0,1fr);gap:2px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dhead h2,.dhead .px{font-size:24px}
}
/* 手機：鎖住縮放與左右晃動，只允許上下捲動 */
html,body{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:640px){
  input,select,textarea{font-size:16px !important}
  /* 手機：首頁表格只留 股票、成交、漲跌、評價 四欄，不用左右滑 */
  table.q th:nth-child(n+4):not(:nth-child(9)), table.q td:nth-child(n+4):not(:nth-child(9)){display:none}
  table.q{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 開場動畫：一道光由左到右沿著 V 畫到底，接著「value 價值台股」由左到右浮現，播完才淡出進入頁面 */
.intro-splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .5s ease}
.intro-splash.out{opacity:0;pointer-events:none}
.intro-box{display:grid;justify-items:center;gap:18px}
.intro-v{width:150px;height:144px;overflow:visible}
.intro-v path{fill:none;stroke-width:17;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.intro-glow{fill:#fff;transition:opacity .4s;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #a78bfa)}
.intro-name{display:grid;justify-items:center;gap:2px;clip-path:inset(0 100% 0 0)}
.intro-name.on{animation:introReveal .8s ease-out forwards}
.intro-name b{font-family:"Outfit",sans-serif;font-weight:800;font-size:46px;line-height:1;color:var(--strong);letter-spacing:.5px}
.intro-name span{font-weight:700;font-size:15px;letter-spacing:6px;color:var(--muted);padding-left:6px}
@keyframes introReveal{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.intro-splash{display:none}}

// 河流圖要畫到「現在」：最後一個月的資料若早於現價日期，補一欄本月（股價＝現價，河流帶＝最新每股盈餘或淨值），

function chartData(s, key) {

  }

  g += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>`;

function spark(rec) {

const LIVE = {briefs: {}, market: null, quotes: null, val: {}};
// 最新一筆估值資料：每月排程寫進資料庫的月底估值（若比內建的季資料新）優先

// 同一個月只留最新的一筆（季資料以月份為單位，月股價以 ym 為單位）
function mergeBy(a, b, key) { const m = new Map(); (a || []).concat(b || []).forEach(x => { if (!x || !x[key]) return; const k = String(x[key]).slice(0, 7), o = m.get(k); if (!o || x[key] >= o[key]) m.set(k, x); }); return [...m.values()].sort((x, y) => x[key] < y[key] ? -1 : 1); }

    if (pts.length < 4) { s[key] = null; continue; }
    const mults = pts.map(p => p[2]);

  if (!DATA) { $('#app').innerHTML = '<p class="nodata">無資料</p>'; return; }
  const h = location.hash.slice(1), m = h.match(/^s(\d{4})(?:-(today|k))?$/);
  const y = window.scrollY;
  if (m) detail(m[1], m[2] || 'river'); else home();
  window.scrollTo(0, keepScroll ? y : 0);
  const toEnd = () => document.querySelectorAll('.chart').forEach(c => { c.scrollLeft = c.scrollWidth; }); // 圖表預設停在最新的時間
  toEnd(); requestAnimationFrame(toEnd);
  notifyScan();
}
window.addEventListener('hashchange', () => route(false));
route(false);

// 盤後更新：排程每天收盤後把收盤價寫進資料庫，網頁收到就重算燈號
function applyLive(doc) {
  if (!doc || !doc.items) return;
  let n = 0;
  DATA.stocks.forEach(s => {
    const q = doc.items[s.code], v = s.verdict;
    if (!q || !(q.price > 0) || !v || !((q.date + (q.time ? ' ' + q.time : '')) >= v.priceDate)) return;
    const m = s[s.method], mult = q.price / v.base;
    const hist = s.snapshots.map(x => x[s.method]).filter(Boolean);
    Object.assign(v, {price: q.price, priceDate: q.date + (q.time ? ' ' + q.time : ''), multiple: Math.round(mult * 100) / 100,
      zone: mult < m.quantiles.p25 ? '低估' : (mult > m.quantiles.p75 ? '高估' : '合理'),
      rank: Math.round(hist.filter(x => x < mult).length / Math.max(1, hist.length) * 100)});
    if (q.change != null) { s.liveChange = q.change; s.liveDate = q.date; }
    if (Array.isArray(q.recent) && q.recent.length) { const m = new Map(); (s.recent || []).concat(q.recent).forEach(x => { if (x && x.date && x.close > 0) m.set(x.date, x); }); s.recent = [...m.values()].sort((x, y) => x.date < y.date ? -1 : 1).slice(-20); }
    s.latest = {date: q.date + (q.time ? ' ' + q.time : ''), open: q.open, high: q.high, low: q.low, close: q.price, volume_shares: q.volumeLots != null ? q.volumeLots * 1000 : null};
    n++;
  });
  if (n) {
    $('#stamp').textContent = `股價更新：${doc.updatedAt}（台北時間，來源：${doc.source || '無資料'}）・評價資料：證交所`;
    route(true);
  }
}
// 獨立網站：排程每天把盤後資料推到 live.json（同一個網址底下）
(async () => {
  if (window.claude) return;
  try {
    const r = await fetch('live.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
    const j = await r.json();
    Object.entries(j.valuation || {}).forEach(([code, doc]) => { const s = DATA.stocks.find(x => x.code === code); if (s) applyVal(s, doc); });
    if (j.market) LIVE.market = j.market;
    if (j.briefs) Object.assign(LIVE.briefs, j.briefs);
    if (j.quotes) { LIVE.quotes = j.quotes; applyLive(j.quotes); }
    route(true);
  } catch (e) { /* 讀不到就維持網頁內建的收盤價 */ }
})();
(async () => {
  try {
    const db = await window.claude?.use?.('db');
    if (!db) return;
    db.doc('quotes/latest').onSnapshot(snap => { if (snap.exists) { LIVE.quotes = snap.data(); applyLive(LIVE.quotes); } }, () => {});
    db.collection('valuation').onSnapshot(qs => { qs.docs.forEach(d => { const s = DATA.stocks.find(x => x.code === d.id); if (s) applyVal(s, d.data()); }); if (LIVE.quotes) applyLive(LIVE.quotes); route(true); }, () => {});
    db.collection('briefs').onSnapshot(qs => { qs.docs.forEach(d => { LIVE.briefs[d.id] = d.data(); }); route(true); }, () => {});
    db.doc('market/today').onSnapshot(snap => { LIVE.market = snap.exists ? snap.data() : null; route(true); }, () => {});
    const user = await window.claude?.use?.('user');
    const uid = user ? await user.id() : null;
    if (uid) {
      G.ref = db.collection('data/users/' + uid).doc('groups');
      const snap = await G.ref.get();
      if (snap.exists && Array.isArray(snap.data().list) && snap.data().list.length) { G.list = cleanGroups(snap.data().list); if (!location.hash.startsWith('#s')) home(); }
      else saveGroups();
    }
  } catch (e) { /* 沒有即時資料時，維持網頁內建的收盤價 */ }
})();
</script>
