    steps:
      - run: |
          O="Origin: https://ziyaoyan1229-debug.github.io"
          for u in "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw" "https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=20261016&stockNo=2330" "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW?interval=5m&range=5d" "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=2330&start_date=2026-10-01"; do
            echo "== $u"; curl -sS -m 20 -A "Mozilla/5.0" -H "$O" -D - -o body.txt "$u" | grep -iE "^HTTP|access-control"; head -c 300 body.txt; echo; done
