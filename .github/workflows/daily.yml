# 每個交易日收盤後（台北 17:07）抓證交所盤後資料更新 live.json，並把新的通知推到手機。
name: daily
on:
  schedule:
    - cron: '7 9 * * 1-5'   # UTC 09:07 = 台北 17:07
  workflow_dispatch:
    inputs:
      date:
        description: 測試用：指定交易日 YYYY-MM-DD（不 commit、不推播）
        required: false
permissions:
  contents: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 抓盤後資料
        env:
          DATE: ${{ inputs.date }}
        run: cp live.json /tmp/old.json && python3 tools/daily.py
      - name: commit
        if: ${{ !inputs.date }}
        run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add live.json
          git diff --cached --quiet && { echo 沒有變更; exit 0; }
          git commit -m "盤後資料 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
      - name: 推播新通知
        if: ${{ !inputs.date }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash scripts/notify.sh /tmp/old.json live.json
  # 全部上市櫃股票（網站「任何股票都能查」）：補今天的收盤和本益比，更新搜尋用的清單；每檔的河流圖每月 3 日由 univ.yml 重做
  univ:
    needs: update
    if: ${{ !inputs.date }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 抓全部股票今天的行情
        run: |
          Y=$(TZ=Asia/Taipei date +%Y)
          python3 tools/univ_hist.py twse $Y
          python3 tools/univ_hist.py tpex $Y
          python3 tools/univ_build.py --index
      - name: commit
        run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add data/u/m data/u/all.json data/u/recent.json
          git diff --cached --quiet && { echo 沒有變更; exit 0; }
          git commit -m "全部股票盤後資料 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin main && break; sleep $((i*5)); done
