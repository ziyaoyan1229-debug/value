# 手動推上新的 live.json 後（GitHub 排程 daily.yml 自己會推播，不靠這個），把這次新產生的通知推到有開推播的手機。
# 只推 live.json 裡這次 commit 新增的 events，每台裝置只收它追蹤的股票和勾選的類型（由 worker 過濾）。
name: notify
on:
  push:
    branches: [main]
    paths: ['live.json']
  workflow_dispatch:
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 推播新通知
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          git show HEAD~1:live.json > /tmp/old.json 2>/dev/null || echo '{}' > /tmp/old.json
          bash scripts/notify.sh /tmp/old.json live.json
