# 部署價值台股的背景推播後端（worker/push.js）到 Cloudflare Workers 免費方案：iPhone 主畫面 App、Android、電腦，網站關著也收得到通知。
# 需要 GitHub secrets：CF_API_TOKEN（Cloudflare「Edit Cloudflare Workers」範本建的 API Token，可以和 coin-app 共用）、CF_ACCOUNT_ID。
# 發送用密鑰 PUSH_KEY 由 CF_API_TOKEN 算出（notify.yml 用同一個算法），不用另外設。
# 改到 worker/ 時自動重新部署，也可以手動執行。
name: push
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/push.yml']
  workflow_dispatch:
concurrency:
  group: push
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 部署到 Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo '還沒設定 CF_API_TOKEN／CF_ACCOUNT_ID，跳過'; exit 0; fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # KV：存裝置訂閱和 VAPID 金鑰，沒有就建一個（和 coin-app 的分開）
          ID=$(curl -fsS -H "$H" "$API/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="value-push-subs") | .id' | head -1)
          if [ -z "$ID" ]; then ID=$(curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' -d '{"title":"value-push-subs"}' "$API/storage/kv/namespaces" | jq -r .result.id); fi
          [ -n "$ID" ] && [ "$ID" != null ] || { echo '建 KV 失敗（API Token 權限要有 Workers KV Storage: Edit）'; exit 1; }
          SUB=$(curl -fsS -H "$H" "$API/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$SUB" ]; then
            for N in "value-${CLOUDFLARE_ACCOUNT_ID:0:6}" "vp-$CLOUDFLARE_ACCOUNT_ID"; do
              SUB=$(curl -sS -X PUT -H "$H" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$N\"}" "$API/workers/subdomain" | jq -r '.result.subdomain // empty')
              [ -n "$SUB" ] && break
            done
            [ -n "$SUB" ] || { echo '註冊 workers.dev 子網域失敗'; exit 1; }
          fi
          cd worker
          printf 'name = "value-push"\nmain = "push.js"\ncompatibility_date = "2025-01-01"\nworkers_dev = true\n\n[[kv_namespaces]]\nbinding = "SUBS"\nid = "%s"\n' "$ID" > wrangler.toml
          npx -y wrangler@4 deploy
          KEY="$(printf '%s' "${CLOUDFLARE_API_TOKEN}value-push" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$KEY" | npx -y wrangler@4 secret put PUSH_KEY
          URL="https://value-push.$SUB.workers.dev"
          echo "推播後端：$URL"
          echo "### 推播後端：$URL" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 24); do curl -fsS "$URL/vapid" > /dev/null 2>&1 && { echo '後端正常'; break; }; sleep 10; done
          echo "已訂閱裝置：$(curl -sS -H "Authorization: Bearer $KEY" "$URL/stats")"
