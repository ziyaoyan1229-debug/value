# 大盤本益比、淨值比、殖利率（自算，每月最後一個交易日），寫進 data/hist/mkt-pe.json 並 commit。手動或每月。
name: mkt
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 1 * *'
permissions:
  contents: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 抓資料
        run: python3 tools/fetch_mktpe.py
      - name: commit
        run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add data/hist
          git diff --cached --quiet && exit 0
          git commit -m "大盤本益比歷史（自算）"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
